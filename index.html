<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Memory Booth</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#14121a;--fg:#f3eefc;--card:#211d2c;--ac:#a78bfa;--ok:#8fe3b0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;text-align:center}
main{max-width:680px;margin:0 auto;padding:14px}h1{margin:6px 0 0;font-size:1.5rem}
#pose{margin:6px 0 10px;font-size:1.05rem}
.stage{position:relative;background:#000;border-radius:14px;overflow:hidden}
canvas{width:100%;display:block}
button{background:var(--ac);color:#111;border:0;border-radius:12px;padding:14px 22px;font-size:1rem;font-weight:700;margin:6px;cursor:pointer}
button:disabled{opacity:.5}
.bar{height:10px;background:#fff2;border-radius:5px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;width:0;background:var(--ac)}
label{display:block;margin:8px;font-size:.9rem;color:#cfc7e6}
#st{color:var(--ok);min-height:1.4em}.hide{display:none!important}
#hot{position:fixed;right:0;bottom:0;width:36px;height:36px;opacity:0}
.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:9}
.box{background:var(--card);border-radius:16px;padding:18px;max-width:760px;width:92%;max-height:90vh;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}.grid img{width:100%;border-radius:8px}
input{padding:10px;border-radius:8px;border:1px solid #555;background:#111;color:#fff;width:70%}
</style></head><body><main>
<h1 id="ttl">Core Memory Booth</h1><div id="pose">Starting camera…</div>
<div class="stage"><video id="v" playsinline muted class="hide"></video><canvas id="c" width="640" height="480"></canvas></div>
<div class="bar hide" id="bar"><i id="fill"></i></div><div id="st"></div>
<label id="consentRow"><input type="checkbox" id="consent" style="width:auto"> I agree my meme may be saved to the creator's private gallery</label>
<div><button id="cap">📸 Capture</button><button id="qr" class="hide">Get QR Code</button><button id="dl" class="hide">Download</button><button id="next" class="hide">Next Victim</button></div>
<div id="hot" title=""></div>
</main>
<script type="module">
/* ===== CONFIG (Supabase Storage) =====
   PRIVATE bucket: anon INSERT only, no SELECT  -> guests can add, only you can read.
   SHARE bucket (optional, PUBLIC): anon INSERT only -> used only when a guest taps "Get QR Code".
   Music files: put piano.mp3, anime.mp3, bass.mp3 in ./assets/ on your site. */
const CFG={url:"",anon:"",bucket:"memes",shareBucket:"share"};

import {HandLandmarker,FaceDetector,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const $=i=>document.getElementById(i),cv=$("c"),x=cv.getContext("2d"),v=$("v");
const W=640,H=480;let hand,face,state=1,info={hands:[],fy:null},snapCanvas=null,final=null,audio=null,scn,lastT=0;

/* ---------- Meme editor ---------- */
const vig=(c,s)=>{const d=c.getContext("2d"),im=d.getImageData(0,0,c.width,c.height),a=im.data;
 for(let y=0;y<c.height;y++)for(let q=0;q<c.width;q++){const dx=(q-c.width/2)/(c.width/2),dy=(y-c.height/2)/(c.height/2),f=1-s*Math.max(0,Math.min(1,Math.hypot(dx,dy)-.3)),i=(y*c.width+q)*4;a[i]*=f;a[i+1]*=f;a[i+2]*=f}
 d.putImageData(im,0,0)};
const mk=(w,h)=>{const c=document.createElement("canvas");c.width=w;c.height=h;return c};
const tint=(c,r,g,b)=>{const d=c.getContext("2d"),im=d.getImageData(0,0,c.width,c.height),a=im.data;for(let i=0;i<a.length;i+=4){a[i]*=r;a[i+1]*=g;a[i+2]*=b}d.putImageData(im,0,0)};
const txt=(d,t,px,py,size,col,al="center",stroke)=>{d.font=`800 ${size}px Impact,Arial Black,sans-serif`;d.textAlign=al;if(stroke){d.lineWidth=stroke;d.strokeStyle="#000";d.strokeText(t,px,py)}d.fillStyle=col;d.fillText(t,px,py)};
const EDIT={
 core(src){const p=mk(W,H);p.getContext("2d").drawImage(src,0,0);tint(p,1.08,1,.88);vig(p,.35);
  const c=mk(W+80,H+190),d=c.getContext("2d");d.fillStyle="#faf5eb";d.fillRect(0,0,c.width,c.height);d.drawImage(p,40,40);
  txt(d,"CORE MEMORY UNLOCKED",c.width/2,H+105,36,"#5a3c28");txt(d,"this one's going in the vault",c.width/2,H+152,22,"#8c6e5a");return c},
 villain(src){const c=mk(W,H),d=c.getContext("2d");d.drawImage(src,0,0);tint(c,1.35,.55,.55);vig(c,.8);
  d.strokeStyle="rgba(255,255,255,.55)";for(let i=0;i<90;i++){const a=Math.random()*6.283,r1=W*(.45+Math.random()*.25);d.lineWidth=1+Math.random()*3;d.beginPath();d.moveTo(W/2+r1*Math.cos(a),H/2+r1*Math.sin(a));d.lineTo(W/2+W*Math.cos(a),H/2+W*Math.sin(a));d.stroke()}
  d.fillStyle="#000";d.fillRect(0,H-110,W,110);txt(d,"VILLAIN ORIGIN STORY",W/2,H-60,44,"#ff2828");txt(d,"it all started with this look...",W/2,H-24,22,"#ddd");return c},
 sitcom(src){const c=mk(W,H),d=c.getContext("2d");d.drawImage(src,0,0);const im=d.getImageData(0,0,W,H),a=im.data,o=new Uint8ClampedArray(a);
  for(let y=0;y<H;y++)for(let q=0;q<W;q++){const i=(y*W+q)*4,rr=(y*W+Math.min(W-1,q+6))*4,bb=(y*W+Math.max(0,q-6))*4,k=y%3==0?.7:1,n=(Math.random()-.5)*20;
   a[i]=(o[bb]+n)*k;a[i+1]=(o[i+1]+n)*k;a[i+2]=(o[rr+2]+n)*k}
  d.putImageData(im,0,0);vig(c,.4);txt(d,"SEASON 1  •  EPISODE 1",20,40,28,"#ffff50","left");txt(d,"● REC",W-20,40,26,"#ff3c3c","right");txt(d,"STARRING: YOU",W/2,H-36,44,"#fff","center",6);return c}};
const SCN=[
 {name:"Core Memory Unlocked",pose:"Smile and hold BOTH hands up near your face",music:"assets/piano.mp3",edit:EDIT.core,ok:i=>i.hands.length==2},
 {name:"Villain Origin Story",pose:"Raise ONE fist above your chin and glare",music:"assets/anime.mp3",edit:EDIT.villain,ok:i=>i.fy!=null&&i.hands.some(y=>y<i.fy+.25)},
 {name:"90s Sitcom Main Character",pose:"Show ONE hand and do your best jazz hands",music:"assets/bass.mp3",edit:EDIT.sitcom,ok:i=>i.hands.length>=1}];

/* ---------- Cloud ---------- */
const up=async(blob,bucket)=>{if(!CFG.url||!CFG.anon)return null;const n=`${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
 try{const r=await fetch(`${CFG.url}/storage/v1/object/${bucket}/${n}`,{method:"POST",headers:{apikey:CFG.anon,Authorization:"Bearer "+CFG.anon,"Content-Type":"image/jpeg"},body:blob});return r.ok?n:null}catch(e){return null}};
const toBlob=c=>new Promise(r=>c.toBlob(r,"image/jpeg",.92));

/* ---------- Flow ---------- */
async function init(){
 try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:1280,height:960}});v.srcObject=s;await v.play()}
 catch(e){$("pose").textContent="Camera error: "+(e.name||e)+" — needs HTTPS and camera permission.";return}
 const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
 hand=await HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"},runningMode:"VIDEO",numHands:2});
 face=await FaceDetector.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"},runningMode:"VIDEO"});
 reset();loop()}
function reset(){if(audio){audio.pause();audio=null}scn=SCN[Math.floor(Math.random()*SCN.length)];state=1;final=null;
 $("ttl").textContent=scn.name;$("pose").textContent="👉 "+scn.pose;$("st").textContent="";
 ["qr","dl","next"].forEach(i=>$(i).classList.add("hide"));$("cap").classList.remove("hide");$("consentRow").classList.remove("hide")}
function frame(){const vw=v.videoWidth,vh=v.videoHeight,tr=W/H;let sw=vw,sh=vh;if(vw/vh>tr)sw=vh*tr;else sh=vw/tr;
 x.save();x.translate(W,0);x.scale(-1,1);x.drawImage(v,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,W,H);x.restore()}
function loop(){
 if(state===1){frame();const t=performance.now();
  if(t!==lastT&&v.readyState>=2){lastT=t;const h=hand.detectForVideo(v,t),f=face.detectForVideo(v,t);
   info={hands:h.landmarks.map(l=>l[0].y),fy:f.detections.length?(f.detections[0].boundingBox.originY+f.detections[0].boundingBox.height/2)/v.videoHeight:null};
   x.fillStyle="#fff";h.landmarks.forEach(l=>l.forEach(p=>{x.beginPath();x.arc((1-p.x)*W,p.y*H,3,0,7);x.fill()}))}
  const g=scn.ok(info);txt(x,g?"POSE OK":"match the pose...",12,36,28,g?"#50ff78":"#ff5050","left",4)}
 requestAnimationFrame(loop)}
$("cap").onclick=()=>{state=2;$("cap").classList.add("hide");$("consentRow").classList.add("hide");$("bar").classList.remove("hide");
 const t0=performance.now(),msg=["Analyzing Aura...","Scanning vibes...","Rendering destiny..."];
 (function a(){const p=Math.min((performance.now()-t0)/3000,1);$("fill").style.width=p*100+"%";$("st").textContent=msg[Math.min(2,Math.floor(p*3))];
  if(p<1)return setTimeout(a,50);reveal()})()};
async function reveal(){
 snapCanvas=mk(W,H);snapCanvas.getContext("2d").drawImage(cv,0,0); // raw mirrored frame (no overlays: captured before state change draws)
 state=3;$("bar").classList.add("hide");final=scn.edit(snapCanvas);
 cv.width=final.width;cv.height=final.height;x.drawImage(final,0,0);
 audio=new Audio(scn.music);audio.loop=true;audio.play().catch(()=>{});
 $("st").textContent="";
 if($("consent").checked){const b=await toBlob(final),n=await up(b,CFG.bucket);if(n)$("st").textContent="☁ Saved to creator gallery"}
 ["qr","dl","next"].forEach(i=>$(i).classList.remove("hide"))}
$("next").onclick=()=>{cv.width=W;cv.height=H;reset()};
$("dl").onclick=()=>{const a=document.createElement("a");a.href=final.toDataURL("image/jpeg",.92);a.download="my-meme.jpg";a.click()};
$("qr").onclick=async()=>{const m=document.createElement("div");m.className="modal";m.innerHTML='<div class="box"><b>Scan to open your meme</b><div id="q" style="display:inline-block;background:#fff;padding:12px;margin:12px"></div><p id="qm"></p><button id="x">Close</button></div>';document.body.appendChild(m);
 m.querySelector("#x").onclick=()=>m.remove();
 const n=await up(await toBlob(final),CFG.shareBucket);
 if(n){new QRCode(m.querySelector("#q"),`${CFG.url}/storage/v1/object/public/${CFG.shareBucket}/${n}`);m.querySelector("#qm").textContent="This makes a public link to your meme."}
 else m.querySelector("#qm").textContent="Sharing isn't set up — use Download instead."};

/* ---------- Admin: Ctrl+Shift+A or tap hidden bottom-right corner ---------- */
const admin=()=>{const m=document.createElement("div");m.className="modal";m.innerHTML='<div class="box"><b>Admin</b><br><input id="k" type="password" placeholder="service_role key"> <button id="go">Open</button> <button id="cl">Close</button><div id="g" class="grid"></div></div>';document.body.appendChild(m);
 m.querySelector("#cl").onclick=()=>m.remove();
 m.querySelector("#go").onclick=async()=>{const k=m.querySelector("#k").value,g=m.querySelector("#g"),H={apikey:k,Authorization:"Bearer "+k};g.textContent="Loading…";
  try{const r=await fetch(`${CFG.url}/storage/v1/object/list/${CFG.bucket}`,{method:"POST",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({prefix:"",limit:200,sortBy:{column:"created_at",order:"desc"}})});
   if(!r.ok)throw 0;const L=(await r.json()).filter(f=>/\.jpg$/.test(f.name));g.textContent=L.length?"":"Empty";
   for(const f of L){const b=await (await fetch(`${CFG.url}/storage/v1/object/${CFG.bucket}/${f.name}`,{headers:H})).blob(),i=new Image();i.src=URL.createObjectURL(b);g.appendChild(i)}}
  catch(e){g.textContent="Access denied or network error."}}};
addEventListener("keydown",e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="a"){e.preventDefault();admin()}});
$("hot").onclick=admin;
init();
</script></body></html>

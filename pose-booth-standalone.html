<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pose Booth</title>
<style>
:root{--bg:#fff0f6;--fg:#2b1b24;--card:#fff;--ac:#e64980;--mut:#8a6a78}
@media (prefers-color-scheme:dark){:root{--bg:#1d1217;--fg:#fbeaf1;--card:#2a1b22;--ac:#ff7aa8;--mut:#b99aa8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:18px 14px 40px}h1{margin:0 0 4px;font-size:1.5rem}
.card{background:var(--card);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 1px 6px #0002}
button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px;font-size:1rem;font-weight:700;width:100%;cursor:pointer}
button.g{background:none;color:var(--fg);border:1px solid var(--mut);margin-top:8px}
.stage{position:relative;aspect-ratio:3/4;background:#000;border-radius:14px;overflow:hidden}
canvas,video.r{width:100%;height:100%;display:block}
#cam{position:absolute;width:1px;height:1px;opacity:0}
.hud{position:absolute;left:0;right:0;bottom:0;padding:12px;color:#fff;text-align:center;font-weight:700;background:linear-gradient(#0000,#000b);text-shadow:0 1px 3px #000}
.bar{height:8px;background:#fff4;border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#ff8fb8}
.hide{display:none!important}small{color:var(--mut)}
</style></head><body><main>
<h1>🎀 Pose Booth</h1><small>Do each pose. Photos snap on their own, then get cut into a meme video.</small>
<div id="home" class="card">
<button id="start">Start camera</button>
<button class="g" id="songb">Add song (optional audio file)</button><input id="songf" type="file" accept="audio/*" class="hide">
<p><small id="msg">Camera needs HTTPS (or localhost). The pose model loads on first start.</small></p></div>
<div id="cap" class="card hide"><div class="stage"><video id="cam" playsinline muted></video><canvas id="c" width="540" height="720"></canvas>
<div class="hud"><div id="t"></div><div class="bar"><i id="f"></i></div></div></div></div>
<div id="out" class="card hide"><b id="ost">Making your meme…</b><canvas id="cv" width="540" height="720" class="hide"></canvas>
<video id="res" class="r hide" controls playsinline style="border-radius:12px;margin-top:8px"></video>
<a id="dl" download="pose-meme.webm"><button class="hide" id="dlb" style="margin-top:10px">⬇ Download video</button></a>
<button class="g hide" id="again">Do it again</button><small id="sv"></small></div>
</main>
<script type="module">
/* ===== OWNER CONFIG (optional) =====
   Private cloud save via Supabase Storage. Create a PRIVATE bucket, add an INSERT-only policy for the anon role
   (no SELECT policy), and only you can see files in your Supabase dashboard. Leave blank to skip cloud save. */
const CLOUD={url:"",anonKey:"",bucket:"videos"};
const SONG_URL=""; // optional: URL of your own audio file hosted next to this page, e.g. "song.mp3"

import {PoseLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const $=i=>document.getElementById(i);
const POSES=[
 {t:"Hold both hands up beside your face 🍩",ico:"🍩",ok:(L,s)=>both(L,w=>Math.abs(w.x-L[0].x)>1.1*s&&w.y<L[11].y&&w.y>L[0].y-1.5*s)},
 {t:"Fist to your mouth 🤜",ico:"👊",ok:(L,s)=>[L[15],L[16]].some(w=>w.v>.4&&dist(w,mid(L[9],L[10]))<.9*s)},
 {t:"Both fists under your chin ✊✊",ico:"✊",ok:(L,s)=>{const c={x:L[0].x,y:L[9].y+.9*s};return both(L,w=>dist(w,c)<1.3*s)&&dist(L[15],L[16])<2.4*s}},
 {t:"Claws up beside your head 🐱",ico:"🐱",ok:(L,s)=>both(L,w=>w.y<L[0].y&&Math.abs(w.x-L[0].x)>1.0*s)}];
const CAPS=["me when","POV:","nobody:","it's time"];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
const both=(L,f)=>[L[15],L[16]].every(w=>w.v>.4&&f(w));
let pl,stream,shots=[],idx=0,hold=0,song=null,songUrl=SONG_URL,lastL=null;
$("songb").onclick=()=>$("songf").click();$("songf").onchange=e=>{const f=e.target.files[0];if(f){songUrl=URL.createObjectURL(f);$("songb").textContent="Song added ✓"}};

$("start").onclick=async()=>{
 $("msg").textContent="Starting camera…";
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:960},height:{ideal:1280}}})}
 catch(e){$("msg").textContent="Camera error: "+(e.name||e)+". Open this page over HTTPS (or localhost) and allow camera access.";return}
 $("msg").textContent="Loading pose model…";
 try{const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  pl=await PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},runningMode:"VIDEO",numPoses:1})}
 catch(e){$("msg").textContent="Couldn't load the pose model (check your internet).";return}
 const v=$("cam");v.srcObject=stream;await v.play();
 $("home").classList.add("hide");$("cap").classList.remove("hide");shots=[];idx=0;hold=0;$("t").textContent=POSES[0].t;draw()};

const cx=$("c").getContext("2d");let lastT=-1,matchLock=false;
function fx(x,L,W,H,tm){ // cute filter: pink wash, hearts, cat ears, blush
 x.fillStyle="rgba(255,170,205,.22)";x.fillRect(0,0,W,H);
 x.font="64px serif";x.textAlign="center";
 for(let i=0;i<7;i++){x.globalAlpha=.55;x.fillText("💗",(i*97+40)%W,H*.15+((i*131+tm/25)%(H*.8)));}x.globalAlpha=1;
 if(!L)return;const P=p=>({x:(1-p.x)*W,y:p.y*H}),n=P(L[0]),e1=P(L[2]),e2=P(L[5]),s=dist(e1,e2)*2.2;
 const ear=(dx,dir)=>{x.fillStyle="#ff8fc0";x.beginPath();x.moveTo(n.x+dx-dir*s*.35,n.y-s*1.55);x.lineTo(n.x+dx+dir*s*.15,n.y-s*2.15);x.lineTo(n.x+dx+dir*s*.45,n.y-s*1.45);x.fill()};
 ear(-s*.45,1);ear(s*.45,-1);
 x.fillStyle="rgba(255,100,160,.55)";for(const e of[e1,e2]){x.beginPath();x.ellipse(e.x,e.y+s*.45,s*.2,s*.11,0,0,7);x.fill()}}

function draw(){
 if(!stream)return;const v=$("cam"),W=540,H=720;
 const vr=v.videoWidth/v.videoHeight,tr=W/H;let sw=v.videoWidth,sh=v.videoHeight;if(vr>tr)sw=sh*tr;else sh=sw/tr;
 cx.save();cx.translate(W,0);cx.scale(-1,1);cx.drawImage(v,(v.videoWidth-sw)/2,(v.videoHeight-sh)/2,sw,sh,0,0,W,H);cx.restore();
 const now=performance.now();let ok=false;
 if(v.currentTime!==lastT){lastT=v.currentTime;const r=pl.detectForVideo(v,now);const l=r.landmarks&&r.landmarks[0];
  if(l){const L=l.map((p,i)=>({x:p.x,y:p.y,v:p.visibility??1}));const s=dist(L[7],L[8]);lastL=l;if(s>.04)ok=POSES[idx].ok(L,s)}else lastL=null}
 fx(cx,lastL,W,H,now);
 // side hint cards
 cx.font="40px serif";cx.fillStyle="#fffc";[40,W-40].forEach(px=>{cx.beginPath();cx.roundRect(px-34,H*.35,68,90,12);cx.fill()});
 cx.fillStyle="#000";cx.fillText(POSES[idx].ico,40,H*.35+58);cx.fillText(POSES[idx].ico,W-40,H*.35+58);
 if(v.currentTime===lastT||true){hold=ok?Math.min(hold+1,12):Math.max(hold-1,0)}
 $("f").style.width=hold/12*100+"%";
 if(hold>=12&&!matchLock){matchLock=true;snap();return}
 requestAnimationFrame(draw)}

async function snap(){
 const c=document.createElement("canvas");c.width=540;c.height=720;c.getContext("2d").drawImage($("c"),0,0);shots.push(c);
 cx.fillStyle="#fff";cx.fillRect(0,0,540,720);idx++;hold=0;
 if(idx>=POSES.length){stream.getTracks().forEach(t=>t.stop());stream=null;pl.close();setTimeout(make,500);return}
 $("t").textContent="Nice! Next…";await new Promise(r=>setTimeout(r,1300));$("t").textContent=POSES[idx].t;matchLock=false;draw()}

function meme(x,t,i){x.font="900 52px Impact,Arial Black,sans-serif";x.textAlign="center";x.lineWidth=8;x.strokeStyle="#000";x.fillStyle="#fff";const y=i%2?690:90;x.strokeText(t.toUpperCase(),270,y);x.fillText(t.toUpperCase(),270,y)}
async function make(){
 $("cap").classList.add("hide");$("out").classList.remove("hide");$("cv").classList.remove("hide");
 const cv=$("cv"),x=cv.getContext("2d"),AC=new AudioContext(),dest=AC.createMediaStreamDestination();let au=null;
 if(songUrl){try{au=new Audio(songUrl);au.crossOrigin="anonymous";const s=AC.createMediaElementSource(au);s.connect(dest);s.connect(AC.destination)}catch(e){au=null}}
 const out=new MediaStream([...cv.captureStream(30).getVideoTracks(),...dest.stream.getAudioTracks()]);
 const mt=["video/webm;codecs=vp9,opus","video/webm","video/mp4"].find(t=>MediaRecorder.isTypeSupported(t)),rec=new MediaRecorder(out,{mimeType:mt,videoBitsPerSecond:3e6}),ch=[];
 rec.ondataavailable=e=>ch.push(e.data);const done=new Promise(r=>rec.onstop=r);
 const per=1100,N=shots.length,total=per*N+1800;rec.start();if(au)au.play().catch(()=>{});const t0=performance.now();
 await new Promise(res=>{(function fr(){const t=performance.now()-t0;if(t>=total){res();return}
  x.fillStyle="#000";x.fillRect(0,0,540,720);
  if(t<per*N){const i=Math.floor(t/per),lt=t%per,b=(lt%550)/550,z=1+.18*(1-b);
   x.save();x.translate(270+(Math.random()-.5)*10*(1-b),360+(Math.random()-.5)*10*(1-b));x.rotate((i%2?1:-1)*.03*(1-b));x.scale(z,z);x.drawImage(shots[i],-270,-360);x.restore();
   if(lt<90){x.fillStyle="#fff8";x.fillRect(0,0,540,720)}meme(x,CAPS[i%CAPS.length],i)}
  else{const lt=t-per*N;x.fillStyle="#2b1b24";x.fillRect(0,0,540,720);shots.forEach((im,i)=>{if(lt>i*220)x.drawImage(im,(i%2)*270,Math.floor(i/2)*360,270,360)});
   const s=1+.06*Math.sin(lt/90);x.save();x.translate(270,360);x.scale(s,s);x.font="900 54px Impact,Arial Black,sans-serif";x.textAlign="center";x.lineWidth=8;x.strokeStyle="#000";x.fillStyle="#fff";x.strokeText("SEE YOU SOON!",0,0);x.fillText("SEE YOU SOON!",0,0);x.restore()}
  requestAnimationFrame(fr)})()});
 rec.stop();if(au)au.pause();await done;
 const blob=new Blob(ch,{type:mt.split(";")[0]}),u=URL.createObjectURL(blob);
 cv.classList.add("hide");$("res").src=u;$("res").classList.remove("hide");$("dl").href=u;$("dl").download="pose-meme."+(mt.includes("mp4")?"mp4":"webm");
 $("ost").textContent="Your meme is ready!";$("dlb").classList.remove("hide");$("again").classList.remove("hide");$("again").onclick=()=>location.reload();
 if(CLOUD.url&&CLOUD.anonKey){$("sv").textContent="Saving…";try{const r=await fetch(`${CLOUD.url}/storage/v1/object/${CLOUD.bucket}/${Date.now()}.${$("dl").download.split(".")[1]}`,{method:"POST",headers:{apikey:CLOUD.anonKey,Authorization:"Bearer "+CLOUD.anonKey,"Content-Type":blob.type},body:blob});$("sv").textContent=r.ok?"Saved ✓":"Cloud save failed."}catch(e){$("sv").textContent="Cloud save failed."}}}
</script></body></html>
